<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Shield shape: rectangle top + rounded bottom -->
  <defs>
    <clipPath id="shield">
      <path d="M0,0 H512 V320 Q512,512 256,512 Q0,512 0,320 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shield)">
    <!-- Gold background -->
    <rect width="512" height="512" fill="#C6993E"/>
    <!-- Red square upper-left -->
    <rect x="0" y="0" width="220" height="200" fill="#C41E3B"/>
    <!-- Navy diagonal stripe -->
    <polygon points="0,180 0,440 240,512 300,512 80,200 220,200 220,0 140,0" fill="#00305B"/>
    <!-- Navy circles - 3 columns x 4 rows on the right -->
    <g fill="#00305B">
      <!-- Row 1 -->
      <circle cx="300" cy="72" r="30"/>
      <circle cx="380" cy="72" r="30"/>
      <circle cx="460" cy="72" r="30"/>
      <!-- Row 2 -->
      <circle cx="300" cy="168" r="30"/>
      <circle cx="380" cy="168" r="30"/>
      <circle cx="460" cy="168" r="30"/>
      <!-- Row 3 -->
      <circle cx="300" cy="264" r="30"/>
      <circle cx="380" cy="264" r="30"/>
      <circle cx="460" cy="264" r="30"/>
      <!-- Row 4 -->
      <circle cx="300" cy="360" r="30"/>
      <circle cx="380" cy="360" r="30"/>
      <circle cx="460" cy="360" r="30"/>
    </g>
  </g>
</svg>
